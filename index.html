<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Studio Tasks</title>
<style>
:root{--bg:#f4f6fb;--g1:#0f1f4a;--g2:#f4f6fb;--f1:#0f1f4a;--f2:#fff;--f3:#0f1f4a;--f4:#fff;--f5:#0f1f4a;--qb:#0f1f4a;--card:#fff;--ink:#0f1f4a;--mute:#6a7391;--line:#dde2ef;--navy:#0f1f4a;--accent:#ffbc13;--ok:#2f9e6a;--bar:#0f1f4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1230;--g1:#070d24;--g2:#13204a;--f1:#0f1f4a;--f2:#fff;--f3:#0f1f4a;--f4:#fff;--f5:#0f1f4a;--qb:#fff;--card:#13204a;--ink:#f1f4ff;--mute:#9aa5cc;--line:#26346b;--bar:#070d24}}
:root[data-theme="dark"]{--bg:#0a1230;--g1:#070d24;--g2:#13204a;--f1:#0f1f4a;--f2:#fff;--f3:#0f1f4a;--f4:#fff;--f5:#0f1f4a;--qb:#fff;--card:#13204a;--ink:#f1f4ff;--mute:#9aa5cc;--line:#26346b;--bar:#070d24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--g1);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.logo-w{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-n{display:none}:root:not([data-theme="light"]) .logo-w{display:block}}
:root[data-theme="dark"] .logo-n{display:none}:root[data-theme="dark"] .logo-w{display:block}
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.top img{height:54px;display:block}
.top .who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-weight:700}
.badge{background:var(--accent);color:#0f1f4a;border-radius:20px;padding:2px 14px;font-size:.9rem}
.quote{background:var(--navy);color:#fff;text-align:center;padding:10px 16px;font-weight:600;border-top:1px solid #ffffff22;border-bottom:3px solid var(--accent)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer}
.btn.y{background:var(--accent);color:#0f1f4a}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer;color:var(--mute);font-size:.8rem}
.top .ghost{color:#fff;border-color:#ffffff55}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 40px}
h2.sec{margin:28px 0 12px;font-size:1.2rem}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;min-height:70vh}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .ph{display:none}}
.hero .logo{width:min(260px,70%);margin:0 0 18px}
.hero .logo img{width:100%;display:block}
.hero h1{margin:0 0 4px;font-size:1.7rem}
.hero p{color:var(--mute);margin:0 0 20px}
.hero .ph img{width:100%;border-radius:20px;display:block}
.roles{display:grid;gap:12px;max-width:340px}
.roles .btn{padding:16px;font-size:1.1rem;text-align:center}
.form{display:grid;gap:12px;max-width:380px}
.form label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}
.form input,.form select,.form textarea,.bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}
.prev{color:var(--navy);font-weight:700}
:root .prev{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--navy)}
.day.closed{border-top-color:var(--ok)}
.day h3{margin:0;font-size:1rem}
.day small{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--bg)}
.row.done span{text-decoration:line-through;color:var(--mute)}
.row .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:.75rem;display:grid;place-items:center;flex:none}
.row span{flex:1}
.chk{width:26px;height:26px;border:2px solid var(--navy);border-radius:8px;background:none;cursor:pointer;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;padding:0}
:root .chk{border-color:var(--mute)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk:disabled{cursor:default;opacity:.85}
.row.close{background:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:700}
.plus{border:2px dashed var(--line);background:none;border-radius:16px;min-height:150px;cursor:pointer;color:var(--mute);font-size:2.4rem;display:grid;place-items:center}
.plus small{display:block;font-size:.9rem}
.plus:hover{border-color:var(--accent);color:var(--ink)}
.addt{display:flex;gap:6px}.addt input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.week h3{margin:0 0 2px;font-size:1rem}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:560px){.shots{grid-template-columns:repeat(2,1fr)}}
.shot{aspect-ratio:16/10;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow:hidden;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:4px;inset-inline-start:4px;background:#000a;color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.up{display:grid;place-items:center;cursor:pointer;color:var(--mute);border:2px dashed var(--line);background:none;font-size:.85rem}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0008}
.msg{color:var(--mute);padding:40px 16px;text-align:center}

.msg,.empty{background:var(--card);border-radius:16px;max-width:460px;margin:40px auto}
#app{position:relative;z-index:1}
.hero>div:first-child{background:var(--card);padding:28px;border-radius:24px;box-shadow:0 10px 40px #0f1f4a33}
h2.sec{display:inline-block;background:var(--card);padding:4px 18px;border-radius:20px;border:1px solid var(--line)}
.bgq{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgq span{position:absolute;font-weight:800;font-size:clamp(1.3rem,3.2vw,2.5rem);max-width:42vw;line-height:1.5}
.bgq span{color:#8ea2d6;opacity:.32}
.gal{display:grid;grid-template-columns:1fr 1.7fr;gap:14px}
@media(max-width:700px){.gal{grid-template-columns:1fr}}
.gal figure{margin:0;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}

body::before,body::after{content:"";position:fixed;inset:-20%;pointer-events:none}
body::before{z-index:-2;background:radial-gradient(48% 38% at 20% 25%,rgba(255,255,255,.95),rgba(255,255,255,0)),radial-gradient(38% 30% at 80% 75%,rgba(255,255,255,.9),rgba(255,255,255,0)),linear-gradient(135deg,#0f1f4a 0%,#15306f 55%,#0f1f4a 100%);animation:drift1 26s ease-in-out infinite alternate}
body::after{z-index:-1;background:radial-gradient(30% 22% at 65% 15%,rgba(255,255,255,.8),rgba(255,255,255,0)),radial-gradient(34% 26% at 30% 85%,rgba(255,255,255,.75),rgba(255,255,255,0));animation:drift2 34s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(-4%,-3%) scale(1)}to{transform:translate(5%,4%) scale(1.12)}}
@keyframes drift2{from{transform:translate(5%,3%) scale(1.05)}to{transform:translate(-5%,-4%) scale(.95)}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
.hero2{position:relative;min-height:92vh;display:grid;place-items:center;padding:40px 20px;color:#fff;text-align:center;background-size:cover;background-position:center}
.hin{width:100%;max-width:1000px;display:grid;gap:14px;justify-items:center}
.hero2 .logo img{width:min(240px,60vw);display:block;margin:0 auto}
.hero2 h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem)}
.hero2 p{margin:0 0 10px;opacity:.9;font-size:1.1rem}
.roles2{display:flex;gap:16px;width:100%;max-width:820px;flex-wrap:wrap}
.roles2 .btn{flex:1;min-width:240px;padding:20px;font-size:1.2rem}
.btn.w{background:#fff;color:#0f1f4a}
.nm{display:grid;justify-items:center;line-height:1.25}.sub{font-weight:300;font-size:.78rem;opacity:.85;margin-top:2px}
.hero2 p.verse{font-size:clamp(1.4rem,3vw,2.2rem);font-weight:700;margin:6px 0 18px;opacity:1}
.fcard{background:var(--card);padding:24px;border-radius:20px;max-width:420px;width:100%;text-align:right;box-shadow:0 12px 40px #0006}
</style>
</head>
<body>
<div class="bgq" aria-hidden="true">
<span class="w" style="top:12%;right:5%;transform:rotate(-4deg)">وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ</span>
<span class="w" style="top:34%;left:4%;transform:rotate(3deg)">وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ</span>
<span class="d" style="top:60%;right:7%;transform:rotate(3deg)">إِنَّ مَعَ الْعُسْرِ يُسْرًا</span>
<span class="d" style="top:76%;left:5%;transform:rotate(-3deg)">اشتغل بحب، والنتيجة هتتكلم</span>
<span class="d" style="top:88%;right:28%;transform:rotate(-2deg)">شغل النهارده بيصنع اسمك بكرة ✨</span>
</div>
<div id="app"><div class="msg">جاري التحميل…</div></div>

<dialog id="dlg"><div class="form">
  <h3 style="margin:0">يوم جديد</h3>
  <label>لمين التاسكات؟<select id="dPerson"></select></label>
  <label>التاريخ<input type="date" id="dDate"></label>
  <label>التاسكات (كل تاسك في سطر)<textarea id="dTasks" rows="6" placeholder="مونتاج فيديو كذا&#10;تصميم كذا"></textarea></label>
  <div style="display:flex;gap:8px"><button class="btn y" id="dSave">حفظ</button><button class="ghost" id="dCancel">إلغاء</button></div>
</div></dialog>

function key(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmt(k,o){return parse(k).toLocaleDateString("ar-EG",o||{weekday:"long",day:"numeric",month:"long"})}

function addTag(n){return n.trim().replace(/\s*(تاسكس|tasks)\s*$/i,"")+" Tasks"}
function tg(s){return addTag(String(s||""))}
function myPerson(){return S.people.find(function(p){return p.id===S.me})}
function myOwner(){return S.owners.find(function(p){return p.id===S.me})}
function quote(){return QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length]}

}

}
function bye(){
  return '<section class="hero2" style="'+heroBg()+'"><div class="hin"><div class="logo"><img src="'+LOGO_W+'" alt=""></div><h1>تم تسجيل الخروج ✓</h1><p>شكرًا ليك، نشوفك بكرة 💪<br>تقدر تقفل الصفحة دلوقتي.</p></div></section>';
}
function register(){
  return '<section class="hero2" style="'+heroBg()+'"><div class="hin"><div class="logo"><img src="'+LOGO_W+'" alt=""></div><h1>MK Studio Tasks</h1><p>سجّل بياناتك مرة واحدة، وهتلاقي تاسكاتك مستنياك كل يوم.</p><div class="form fcard"><label>اكتب اسمك كامل<input id="rFull"></label><label>اكتب اسمك للتاسكات<input id="rTag" placeholder="مثلًا: عبده"></label><div class="prev" id="rPrev"></div><div style="display:flex;gap:8px"><button class="btn y" data-a="reg">دخول</button><button class="ghost" data-a="back">رجوع</button></div></div></div></section>';
}
function dayCard(d,o){
  var done=d.tasks.filter(function(t){return t.done}).length,all=done===d.tasks.length&&d.tasks.length>0;
  var p=S.people.find(function(x){return x.id===d.pid});
  var h='<div class="day'+(d.closed?" closed":"")+'"><div><h3>'+fmt(d.date)+'</h3><small>'+(o&&p?esc(p.tag)+" · ":"")+done+"/"+d.tasks.length+(d.closed?" · اليوم اتقفل ✓":"")+(d.byName?" · من "+esc(d.byName):"")+'</small></div>';
  d.tasks.forEach(function(t,i){
    h+='<div class="row'+(t.done?" done":"")+'"><b class="n">'+(i+1)+'</b><span>'+esc(t.t)+'</span><button class="chk'+(t.done?" on":"")+'" data-a="tg" data-id="'+d.id+'" data-i="'+i+'"'+((o||d.closed)?" disabled":"")+'>'+(t.done?"✓":"")+'</button></div>';
  });
  h+='<div class="row close"><b class="n" style="background:var(--accent);color:#0f1f4a">★</b><span>تقفيل اليوم</span><button class="chk'+(d.closed?" on":"")+'" data-a="cl" data-id="'+d.id+'"'+((o||d.closed)?" disabled":"")+'>'+(d.closed?"✓":"")+'</button></div>';
  if(o)h+='<div class="addt"><input placeholder="تاسك إضافي" data-in="'+d.id+'"><button class="ghost" data-a="ad" data-id="'+d.id+'">+</button></div><button class="ghost" data-a="rm" data-id="'+d.id+'">مسح اليوم</button>';
  return h+'</div>';
}
function weeks(days,o){
  var ks=[];days.forEach(function(d){var w=weekOf(d.date);if(ks.indexOf(w)<0)ks.push(w)});
  ks.sort().reverse();var cur=weekOf(key(new Date()));
  if(!ks.length)return"";
  return '<h2 class="sec">ملخص الأسبوع</h2>'+ks.map(function(w){
    var ds=days.filter(function(d){return weekOf(d.date)===w}),tot=0,dn=0;
    ds.forEach(function(d){tot+=d.tasks.length;d.tasks.forEach(function(t){if(t.done)dn++})});
    var end=parse(w);end.setDate(end.getDate()+6);
    var shots=(S.weeks[w]&&S.weeks[w].shots)||[];
    return '<div class="week"><h3>'+(w===cur?"الأسبوع الحالي":"أسبوع")+' · '+fmt(w,{day:"numeric",month:"long"})+' – '+fmt(key(end),{day:"numeric",month:"long"})+'</h3><small style="color:var(--mute)">خلصنا '+dn+' من '+tot+' تاسك</small><div class="shots">'+
    shots.map(function(id,i){return '<div class="shot"><img src="'+blob(id)+'" alt="">'+(o?'<button data-a="rs" data-w="'+w+'" data-i="'+i+'">×</button>':'')+'</div>'}).join("")+
    (S.assets?'<label class="shot up">+ ضيف صورة<input type="file" accept="image/*" multiple hidden data-w="'+w+'"></label>':'')+'</div></div>';
  }).join("");
}
function board(){
  var o=S.role==="o",h=topBar()+'<div class="wrap">';
  if(o){
    var list=S.days.filter(function(d){return!S.filter||d.pid===S.filter});
    h+='<div class="bar"><select id="fP"><option value="">كل الفريق</option>'+S.people.map(function(p){return '<option value="'+p.id+'"'+(S.filter===p.id?" selected":"")+'>'+esc(p.tag)+' — '+esc(p.full)+'</option>'}).join("")+'</select></div><div class="grid"><button class="plus" data-a="new"><div>+<small>يوم جديد</small></div></button>'+list.map(function(d){return dayCard(d,true)}).join("")+'</div>'+weeks(list,true);
  }else{
    var mine=S.days.filter(function(d){return d.pid===S.me});
    h+=mine.length?'<div class="grid">'+mine.map(function(d){return dayCard(d,false)}).join("")+'</div>'+weeks(mine,false):'<div class="empty">لسه مفيش تاسكات النهارده، استنى تاسكاتك توصل ✨</div>';
  }
  return h+gallery()+'</div>';
}
function render(){
  var a=$("app"),f=document.activeElement&&document.activeElement.id;
  if(!S.ready){a.innerHTML='<div class="msg">جاري التحميل…</div>';return}
  if(!S.db){a.innerHTML='<div class="msg">افتح الصفحة وإنت مسجّل دخول على claude.ai عشان التاسكات تتحفظ وتتشارك.</div>';return}
  if(S.bye)a.innerHTML=bye();
  else if(!S.role)a.innerHTML=picker()+'<div class="wrap">'+gallery()+'</div>';
  else if(S.role==="emp"&&!myPerson())a.innerHTML=register();
  else if(S.role==="o"&&!myOwner())a.innerHTML=registerO();
  else a.innerHTML=board();
  var t=$("rTag");if(t){var up=function(){$("rPrev").textContent=t.value.trim()?"هتظهر كده: "+addTag(t.value):""};t.oninput=up;up()}
  var fp=$("fP");if(fp)fp.onchange=function(){S.filter=fp.value;render()};
}
function setRole(r){S.role=r;S.bye=false;if(r)S.out=false;ls("mk_role",r||"");render()}
function patch(id,data){S.db.collection("days").doc(id).update(data).catch(function(){alert("تعذّر الحفظ — تأكد إن عندك صلاحية تعديل.")})}
function getDay(id){return S.days.find(function(d){return d.id===id})}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(a==="role"){
    if(b.dataset.r==="emp"&&myPerson())setRole("emp");else setRole(b.dataset.r);
  }else if(a==="back"){setRole("")}
  else if(a==="out"){S.role=null;S.out=true;S.bye=false;ls("mk_role","out");render()}
  else if(a==="sw"){setRole(S.role==="o"?"emp":"o")}
  else if(a==="regO"){var nm=$("oName").value.trim();if(!nm){$("oName").focus();return}S.db.collection("owners").doc(S.me).set({name:nm,created:Date.now()}).catch(function(){alert("تعذّر التسجيل")})}
  else if(a==="reg"){
    var full=$("rFull").value.trim(),tag=$("rTag").value.trim();
    if(!full||!tag){alert("اكتب الاسمين الأول");return}
    S.db.collection("people").doc(S.me).set({full:full,tag:addTag(tag),created:Date.now()}).catch(function(){alert("تعذّر التسجيل")});
  }else if(a==="new"){
    if(!S.people.length){alert("مفيش موظفين سجلوا لسه.");return}
    $("dPerson").innerHTML=S.people.map(function(p){return '<option value="'+p.id+'">'+esc(p.tag)+' — '+esc(p.full)+'</option>'}).join("");
    if(S.filter)$("dPerson").value=S.filter;
    $("dDate").value=key(new Date());$("dTasks").value="";$("dlg").showModal();
  }else if(a==="tg"){var d=getDay(id),t=d.tasks.map(function(x){return{t:x.t,done:x.done}});t[+b.dataset.i].done=!t[+b.dataset.i].done;patch(id,{tasks:t})}
  else if(a==="cl"){var d2=getDay(id);if(d2.tasks.some(function(x){return!x.done})){alert("كمّل كل التاسكات الأول، وبعدها قفّل اليوم 💪");return}patch(id,{closed:true,closedAt:Date.now()})}
  else if(a==="ad"){var inp=document.querySelector('[data-in="'+id+'"]'),v=inp.value.trim();if(!v)return;var d3=getDay(id);patch(id,{tasks:d3.tasks.concat([{t:v,done:false}]),closed:false})}
  else if(a==="rm"){if(confirm("تمسح اليوم ده بكل تاسكاته؟"))S.db.collection("days").doc(id).delete()}
  else if(a==="rs"){var w=b.dataset.w,sh=(S.weeks[w].shots||[]).slice();sh.splice(+b.dataset.i,1);S.db.collection("weeks").doc(w).set({shots:sh})}
});
$("dCancel").onclick=function(){$("dlg").close()};
$("dSave").onclick=function(){
  var pid=$("dPerson").value,date=$("dDate").value,lines=$("dTasks").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  if(!pid||!date||!lines.length)return;
  var id=date+"_"+pid,ex=getDay(id),tasks=lines.map(function(t){return{t:t,done:false}});
  var bn=(myOwner()||{}).name||"";
  if(ex)patch(id,{tasks:ex.tasks.concat(tasks),closed:false,by:S.me,byName:bn});
  else S.db.collection("days").doc(id).set({date:date,pid:pid,by:S.me,byName:bn,tasks:tasks,closed:false,created:Date.now()});
  $("dlg").close();
};
document.addEventListener("change",async function(e){
  var f=e.target;if(!(f.type==="file"&&f.dataset.w)||!S.assets)return;var w=f.dataset.w,ids=[];
  for(var i=0;i<f.files.length;i++){try{var r=await S.assets.upload(f.files[i]);ids.push(r.id)}catch(x){alert("تعذّر رفع صورة")}}
  if(ids.length){var old=(S.weeks[w]&&S.weeks[w].shots)||[];S.db.collection("weeks").doc(w).set({shots:old.concat(ids)})}
});

try{if(localStorage.getItem("mk_ver")!=="v2"){Object.keys(localStorage).filter(function(k){return k.indexOf("mk_")===0}).forEach(function(k){localStorage.removeItem(k)});localStorage.setItem("mk_ver","v2")}}catch(e){}
var LS={get:function(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
var subs=[];
function load(c){return LS.get("mk_c_"+c)||{}}
function save(c,o){if(!LS.set("mk_c_"+c,o))alert("المساحة امتلت، امسح صور قديمة.");subs.forEach(function(f){f()})}
function blob(id){return LS.get("mk_blob_"+id)||""}
window.addEventListener("storage",function(){subs.forEach(function(f){f()})});
function colRef(c){
  var q={f:null,d:"asc"};
  var ref={
    orderBy:function(f,d){q.f=f;q.d=d||"asc";return ref},
    doc:function(id){return{
      set:function(data){var o=load(c);o[id]=data;save(c,o);return Promise.resolve()},
      update:function(data){var o=load(c);o[id]=Object.assign({},o[id],data);save(c,o);return Promise.resolve()},
      delete:function(){var o=load(c);delete o[id];save(c,o);return Promise.resolve()}}},
    onSnapshot:function(cb){var run=function(){var o=load(c),ids=Object.keys(o);
      if(q.f)ids.sort(function(a,b){var x=o[a][q.f]||"",y=o[b][q.f]||"";return(x<y?-1:x>y?1:0)*(q.d==="desc"?-1:1)});
      cb({docs:ids.map(function(id){return{id:id,data:function(){return o[id]}}})})};subs.push(run);run();return function(){}}
  };return ref}
var db={collection:colRef};
var assetsShim={upload:function(file){return new Promise(function(res,rej){var img=new Image;img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);var id="b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);if(LS.set("mk_blob_"+id,c.toDataURL("image/jpeg",.7)))res({id:id});else rej()};img.onerror=rej;img.src=URL.createObjectURL(file)})}};
(function(){
  var id=ls("mk_id");if(!id){id="u"+Math.random().toString(36).slice(2,10);ls("mk_id",id)}
  S.db=db;S.me=id;S.assets=assetsShim;S.role=ls("mk_role")||null;if(S.role==="out"){S.role=null;S.out=true}
  var first=true;
  db.collection("people").onSnapshot(function(s){S.people=s.docs.map(function(d){var p=Object.assign({id:d.id},d.data());p.tag=tg(p.tag);return p});if(first&&S.role===null&&!S.out&&myPerson())S.role="emp";first=false;S.ready=true;render()});
  db.collection("days").orderBy("date","desc").onSnapshot(function(s){S.days=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()});
  db.collection("owners").onSnapshot(function(s){S.owners=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()});
  db.collection("weeks").onSnapshot(function(s){S.weeks={};s.docs.forEach(function(d){S.weeks[d.id]=d.data()});render()});
})();
</script>
</body>
